<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard - VRMS</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="/customer/dashboard" class="logo">VRMS Customer</a>
      <nav class="nav-links">
        <a href="/customer/search">Search Vehicles</a>
        <a href="/customer/bookings">My Bookings</a>
        <a href="/customer/notifications">Notifications</a>
        <button id="logoutBtn" class="btn btn-outline">Logout</button>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">
      <h1>Customer Dashboard</h1>
      <p>Welcome! Search and book vehicles here.</p>
      <div class="card" style="margin-top: 2rem;">
        <div class="card-body">
          <h3>Quick Actions</h3>
          <a href="/customer/search" class="btn btn-primary">Search Vehicles</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/customer/dashboard.js"></script>
</body>
</html>
