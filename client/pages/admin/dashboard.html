<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - VRMS</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="/admin/dashboard" class="logo">VRMS Admin</a>
      <nav class="nav-links">
        <a href="/admin/verifications">Verifications</a>
        <a href="/admin/users">Users</a>
        <a href="/admin/reports">Reports</a>
        <a href="/admin/audit-logs">Audit Logs</a>
        <button id="logoutBtn" class="btn btn-outline">Logout</button>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">
      <h1>Admin Dashboard</h1>
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Users</h3>
          <p id="statUsers" class="stat-value">-</p>
        </div>
        <div class="stat-card">
          <h3>Pending Verifications</h3>
          <p id="statPending" class="stat-value">-</p>
        </div>
        <div class="stat-card">
          <h3>Total Vehicles</h3>
          <p id="statVehicles" class="stat-value">-</p>
        </div>
        <div class="stat-card">
          <h3>Total Bookings</h3>
          <p id="statBookings" class="stat-value">-</p>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/admin/dashboard.js"></script>
</body>
</html>
